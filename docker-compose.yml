services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: dev  # <--- MAGIE ICI : Compose s'arrête à l'étape dev (inclut pytest)
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
      - LANGFUSE_HOST=http://langfuse-web:3000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - OLLAMA_HOST=http://host.docker.internal:11434
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./backend/src:/app
      - ./backend/tests:/app/tests  # <--- Ajout pour monter tes tests
    networks:
      - chatbot_network
    depends_on:
      - redis
      - langfuse-web

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8502:8501"
    environment:
      - BACKEND_URL=http://backend:8000/chat
    networks:
      - chatbot_network
    depends_on:
      - backend

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - chatbot_network

  # --- LANGFUSE SERVER ---
  langfuse-web:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://langfuse:langfuse_password@langfuse-db:5432/langfuse
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=un_secret_tres_long_et_securise_123456789
      - SALT=un_autre_secret_pour_le_sel_123456789
      - TELEMETRY_ENABLED=false
    networks:
      - chatbot_network

  # --- POSTGRESQL POUR LES TRACES LANGFUSE ---
  langfuse-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=langfuse
      - POSTGRES_PASSWORD=langfuse_password
      - POSTGRES_DB=langfuse
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - chatbot_network

  # --- MLFLOW SERVER ---
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.12.1
    ports:
      - "5000:5000"
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --serve-artifacts
      --host 0.0.0.0
    volumes:
      - mlflow_data:/mlflow
    networks:
      - chatbot_network

volumes:
  langfuse_postgres_data:
  mlflow_data:

networks:
  chatbot_network: